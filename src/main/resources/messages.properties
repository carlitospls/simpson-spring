# Mensajes de las validaciones del DTO.
# Las anotaciones apuntan aquí con message="{clave}".
filtro.edadMax.rango=La edad máxima debe estar entre 0 y 120
filtro.limite.rango=El límite debe estar entre 1 y 50
filtro.ordenarPor.obligatorio=Debes elegir un criterio de ordenación
filtro.ordenarPor.invalido=Solo se puede ordenar por nombre, apellido, edad o lugar

# Cuando escriben texto en un campo numérico (ej: ?edadMax=abc), Spring no
# puede convertirlo a número y genera un error "typeMismatch".
# Formato de la clave: typeMismatch.<objeto>.<campo>
# El objeto es "filtro" por el @ModelAttribute("filtro") del controlador.
typeMismatch.filtro.edadMax=La edad máxima debe ser un número entero
typeMismatch.filtro.limite=El límite debe ser un número entero