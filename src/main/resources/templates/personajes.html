<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head >
    <link rel="stylesheet" th:href="@{/css/estilos.css}">
    <meta charset="UTF-8">
    <title>Personajes</title>
</head>
<body>
<p>Personajes encontrados: <strong th:text="${personajes.size()}">0</strong></p>

<form method="get" th:action="@{/personajes}" th:object="${filtro}">
    <label>Edad máxima: <input type="number" th:field="*{edadMax}"></label>
    <label>Límite: <input type="number" th:field="*{limite}"></label>
    <label>Ordenar por:
        <select th:field="*{ordenarPor}">
            <option value="nombre">Nombre</option>
            <option value="apellido">Apellido</option>
            <option value="edad">Edad</option>
            <option value="lugar">Lugar</option>
        </select>
    </label>
    <label><input type="checkbox" th:field="*{descendente}"> Descendente</label>
    <label><input type="checkbox" th:field="*{soloFamilia}"> Solo familia</label>
    <button type="submit">Buscar</button>
</form>
<table>
    <thead>
    <tr>
        <th>Nombre</th>
        <th>Edad</th>
        <th>Ocupación</th>
        <th>Lugar</th>
    </tr>
    </thead>
    <tbody>

        <tr th:each="p : ${personajes}" th:classappend="${p.esMenor()} ? 'menor'">
            <td th:text="${p.nombreCompleto()}">Nombre</td>
            <td th:text="${p.edad()}">Edad</td>
            <td th:text="${p.ocupacion()}">Ocupación</td>
            <td th:text="${p.lugar()}">Lugar</td>
        </tr>

    </tbody>
</table>
</body>
</html>
