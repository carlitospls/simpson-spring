<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Personajes de Springfield</title>
    <!-- @{...} le añade a la ruta lo que haga falta de la aplicación -->
    <link rel="stylesheet" th:href="@{/css/estilos.css}">
</head>
<body>

<h1>Personajes de Springfield</h1>

<!--
  FORMULARIO
  - method="get": los filtros viajan en la URL (?edadMax=18...), se pueden compartir.
  - th:object="${filtro}": el formulario está ligado al DTO que dejó el controlador.
  - th:field="*{campo}": genera name, id y value por nosotros, y por eso el
    formulario CONSERVA lo que escribiste (en el JSP había que hacerlo a mano).
-->
<form method="get" th:action="@{/personajes}" th:object="${filtro}">

    <fieldset>
        <legend>Filtrar</legend>

        <label>Lugar
            <select th:field="*{lugar}">
                <!-- value="" = sin filtro. El servicio trata "" igual que null -->
                <option value="">— Todos —</option>
                <!-- Una <option> por cada lugar que preparó el controlador -->
                <option th:each="l : ${lugares}" th:value="${l}" th:text="${l}"></option>
            </select>
        </label>

        <label>Ocupación
            <select th:field="*{ocupacion}">
                <option value="">— Todos —</option>
                <option th:each="o : ${ocupaciones}" th:value="${o}" th:text="${o}"></option>
            </select>
        </label>

        <label>Edad máxima
            <input type="number" th:field="*{edadMax}">
            <!-- Solo aparece si ESTE campo tiene error; el texto sale de messages.properties -->
            <span class="error" th:if="${#fields.hasErrors('edadMax')}" th:errors="*{edadMax}"></span>
        </label>

        <label class="check">
            <input type="checkbox" th:field="*{soloFamilia}">
            Solo familia Simpson
        </label>
    </fieldset>

    <fieldset>
        <legend>Ordenar</legend>

        <label>Ordenar por
            <select th:field="*{ordenarPor}">
                <option value="nombre">Nombre</option>
                <option value="apellido">Apellido</option>
                <option value="edad">Edad</option>
                <option value="lugar">Lugar</option>
            </select>
            <span class="error" th:if="${#fields.hasErrors('ordenarPor')}" th:errors="*{ordenarPor}"></span>
        </label>

        <label class="check">
            <input type="checkbox" th:field="*{descendente}">
            Descendente
        </label>

        <label>Mostrar como máximo
            <input type="number" th:field="*{limite}">
            <span class="error" th:if="${#fields.hasErrors('limite')}" th:errors="*{limite}"></span>
        </label>
    </fieldset>

    <button type="submit">Buscar</button>
    <!-- Vuelve a /personajes sin parámetros: todo limpio -->
    <a th:href="@{/personajes}">Limpiar filtros</a>
</form>

<!-- RESULTADOS: solo se muestran si NO hay errores de validación -->
<div th:unless="${hayErrores}">

    <p class="resumen"><strong th:text="${personajes.size()}">0</strong> personajes encontrados</p>

    <!-- Lista vacía: mensaje en lugar de una tabla sin filas -->
    <p class="vacio" th:if="${personajes.isEmpty()}">No hay personajes con esos filtros</p>

    <table th:unless="${personajes.isEmpty()}">
        <thead>
        <tr>
            <th>Nombre</th>
            <th>Edad</th>
            <th>Ocupación</th>
            <th>Lugar</th>
        </tr>
        </thead>
        <tbody>
        <!-- th:each repite el <tr> una vez por personaje.
             th:classappend añade la clase "menor" solo si esMenor() es true -->
        <tr th:each="p : ${personajes}" th:classappend="${p.esMenor()} ? 'menor'">
            <td th:text="${p.nombreCompleto()}">Nombre</td>
            <td th:text="${p.edad()}">Edad</td>
            <td th:text="${p.ocupacion()}">Ocupación</td>
            <td th:text="${p.lugar()}">Lugar</td>
        </tr>
        </tbody>
    </table>

</div>

</body>
</html>
